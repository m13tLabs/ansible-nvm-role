name: CI

on:
  push:
    branches:
      - develop
  pull_request:

jobs:
  lint:
    name: Lint (${{ matrix.os }}, ansible-core ${{ matrix.ansible_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ansible_version: ["2.14", "2.15", "2.16", "2.17", "2.18", "2.19", "2.20", "2.21"]
        include:
          - ansible_version: "2.14"
            python_version: "3.9"
          - ansible_version: "2.15"
            python_version: "3.9"
          - ansible_version: "2.16"
            python_version: "3.10"
          - ansible_version: "2.17"
            python_version: "3.10"
          - ansible_version: "2.18"
            python_version: "3.11"
          - ansible_version: "2.19"
            python_version: "3.11"
          - ansible_version: "2.20"
            python_version: "3.12"
          - ansible_version: "2.21"
            python_version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f test-requirements.txt ] && pip install -r test-requirements.txt
          pip install "ansible-core==${{ matrix.ansible_version }}.*" ansible-lint

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule test (${{ matrix.os }}, ansible-core ${{ matrix.ansible_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ansible_version: ["2.14", "2.15", "2.16", "2.17", "2.18", "2.19", "2.20", "2.21"]
        include:
          - ansible_version: "2.14"
            python_version: "3.9"
          - ansible_version: "2.15"
            python_version: "3.9"
          - ansible_version: "2.16"
            python_version: "3.10"
          - ansible_version: "2.17"
            python_version: "3.10"
          - ansible_version: "2.18"
            python_version: "3.11"
          - ansible_version: "2.19"
            python_version: "3.11"
          - ansible_version: "2.20"
            python_version: "3.12"
          - ansible_version: "2.21"
            python_version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          colima start
          echo "DOCKER_HOST=unix://${HOME}/.colima/default/docker.sock" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible_version }}.*" molecule "molecule-plugins[docker]"
          ansible-galaxy collection install community.docker
          [ -f molecule/default/requirements.txt ] && pip install -r molecule/default/requirements.txt

      - name: Run molecule test
        run: molecule test

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "molecule/default/reports/*.xml"
