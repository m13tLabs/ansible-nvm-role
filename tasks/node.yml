---
- name: Check if node version is installed
  ansible.builtin.shell: "source {{ nvm_dest }}/nvm.sh && nvm version {{ nvm_node_version }}"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ nvm_user }}"
  register: node_check
  changed_when: false
  failed_when: false

- name: Install node
  ansible.builtin.shell: "source {{ nvm_dest }}/nvm.sh && nvm install {{ nvm_node_version }}"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ nvm_user }}"
  when: node_check.stdout == 'N/A' or node_check.rc != 0
  changed_when: true

- name: Set default Node version for new shell
  ansible.builtin.shell: "source {{ nvm_dest }}/nvm.sh && nvm alias default {{ nvm_node_version }}"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ nvm_user }}"
  when: node_check.stdout == 'N/A' or node_check.rc != 0
  changed_when: true
