- name: get stats on node
  stat: path="{{ nvm_dest }}/versions/node/v{{ nvm_node_version }}"
  become: true
  become_user: "{{nvm_user}}"
  register: node_stat

- name: install node
  shell: "source {{ nvm_dest }}/nvm.sh && nvm install {{ nvm_node_version }}"
  args:
     executable: /bin/bash
  become: true
  become_user: "{{nvm_user}}"
  when: not node_stat.stat.exists

- name: set default Node version {{ nvm_node_version }} to be used in new shell
  shell: "source {{nvm_dest}}/nvm.sh && nvm alias default {{nvm_node_version}}"
  args:
     executable: /bin/bash
  become: true
  become_user: "{{nvm_user}}"
  when: not node_stat.stat.exists
