---
# nvm_working_path defaults to "~nvm_user" so the role doesn't have to assume
# /home vs /Users. Shell commands and path-type module args expand that
# themselves, but values passed via `environment:` (e.g. NVM_DIR) are set
# literally with no shell involved, so an unexpanded "~runner" leaks through
# and breaks nvm's own install script. Resolve it to a real absolute path once
# so every downstream use — including environment vars — gets the same value.
- name: Resolve nvm_user's home directory
  ansible.builtin.shell: "echo ~{{ nvm_user }}"
  args:
    executable: /bin/sh
  register: nvm_user_home
  changed_when: false
  when: nvm_working_path.startswith('~')

- name: Use resolved home directory instead of unexpanded tilde
  ansible.builtin.set_fact:
    nvm_working_path: "{{ nvm_user_home.stdout }}"
  when: nvm_working_path.startswith('~')

- name: Discover primary group of nvm_user
  ansible.builtin.command: "id -gn {{ nvm_user }}"
  register: nvm_user_primary_group
  changed_when: false

# nvm_group defaults to nvm_user, which assumes a Linux-style user-private-group
# setup. That doesn't hold on macOS (e.g. the "runner" user's primary group is
# "staff"), so fall back to the user's actual primary group in that case.
- name: Use nvm_user's actual primary group unless nvm_group was overridden
  ansible.builtin.set_fact:
    nvm_group: "{{ nvm_user_primary_group.stdout }}"
  when: nvm_group == nvm_user

- name: Install nvm
  ansible.builtin.include_tasks: nvm.yml

- name: Install node
  ansible.builtin.include_tasks: node.yml

- name: Install npm packages
  ansible.builtin.include_tasks: pkgs.yml
  when: nvm_npm_pkgs | length > 0

# needed in order to preserve idempotency due to globally installed packages
- name: Fix nvm permissions
  ansible.builtin.include_tasks: permission.yml
