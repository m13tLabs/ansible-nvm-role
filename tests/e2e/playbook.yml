---
- name: End-to-end install
  hosts: all
  become: true
  vars:
    ansible_user: runner
    e2e_node_version: "20.11.0"
  tasks:

    - name: Install ansible-nvm-role
      ansible.builtin.include_role:
        name: ansible-nvm-role
      vars:
        nvm_node_version: "{{ e2e_node_version }}"
        nvm_npm_pkgs: []
